<!DOCTYPE html>
<html lang="en">
        
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <title>tT | dev - Contact</title>
        <script src="js/main.js" defer></script>
        <!-- EmailJS SDK -->
        <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
        <script>
            (function() {
                // Initiate EmailJS with public key
                emailjs.init({
                    publicKey: "m18Fe575uJakt7w4Y",
                });
            })();
        </script>
    </head>

    <body>
        <header>
            <div class="banner">
                <h1 id="logo">tT | dev</h1>
                <p>creating practical apps and utilities</p>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav> 
        </header> 

        <main>
            <form id="contact-form">
                <h2>Contact</h2>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Your name">
                <label for="message">Message:</label>
                <textarea id="message" name="message" placeholder="Your message" rows="7"></textarea>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="email@domain.com">
                <div class="form-buttons">
                    <button type="submit" id="submit">Submit</button>
                    <button type="button" id="clear">Clear</button>
                </div>
                <!-- Region for presenting errors via DOM -->
                <ul id="errorlist" aria-live="polite" role="status"></ul>
            </form>
        </main>

        <footer>
            <hr class="footer-banner">
                <div class="footer-links">
                    <h3 id="footer-logo">tT | dev</h3>
                    <ul>
                        <li><a href="https://github.com/mthorgren" target="_blank" rel="noopener noreferrer">github</a></li>
                        <li><a href="https://linkedin.com/in/mthorgren" target="_blank" rel="noopener noreferrer">linkedin</a></li>
                    </ul>
                </div>
                <p>© 2026 Mathias Thorgren</p>
        </footer>

    </body>

</html>
